name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate typed records and team-week scope
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate share contract
        run: python -m unittest discover -s plugins/sc-skills/skills/synapse-share/tests -p 'test_*.py' -v
